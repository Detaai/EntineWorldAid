<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deta Gallery</title>
  <link rel="stylesheet" href="styles-mobile.css" media="only screen and (max-width: 500px)">
  <style>
    body {
      margin: 0;
      font-family: 'Trebuchet MS', Tahoma, sans-serif;
      background: linear-gradient(135deg, #2c1810 0%, #8B4513 50%, #DAA520 100%);
      min-height: 100vh;
      background-attachment: fixed;
    }

    /* Character Title Header */
    .character-header {
      text-align: center;
      padding: 40px 20px;
      background: rgba(218, 165, 32, 0.1);
      border-bottom: 3px solid #DAA520;
      margin-bottom: 30px;
    }

    .character-title {
      font-size: 3rem;
      color: #DAA520;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      margin: 0;
      font-weight: bold;
    }

    .character-subtitle {
      font-size: 1.2rem;
      color: #F4A460;
      margin: 10px 0 0 0;
      font-style: italic;
    }

    header {
      background: linear-gradient(135deg, #DAA520, #B8860B);
      padding: 15px 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border-bottom: 2px solid #8B4513;
    }

    .home-link {
      text-decoration: none;
      color: #2c1810;
      font-size: 18px;
      font-weight: bold;
      transition: all 0.3s ease;
      padding: 8px 15px;
      border-radius: 5px;
    }

    .home-link:hover {
      background: rgba(44, 24, 16, 0.1);
      transform: translateX(-5px);
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .image-card {
      background: linear-gradient(145deg, #F4A460, #DAA520);
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      text-align: center;
      padding: 15px;
      transition: all 0.4s ease;
      border: 2px solid #8B4513;
      position: relative;
    }

    .image-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 15px 35px rgba(218, 165, 32, 0.4);
    }

    .image-card img {
      width: 100%;
      border-radius: 12px;
      border: 3px solid #8B4513;
      transition: all 0.3s ease;
    }

    .image-card:hover img {
      border-color: #2c1810;
    }

    .image-card button {
      margin-top: 15px;
      padding: 12px 20px;
      background: linear-gradient(135deg, #8B4513, #2c1810);
      color: #DAA520;
      border: 2px solid #DAA520;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .image-card button:hover {
      background: linear-gradient(135deg, #2c1810, #8B4513);
      color: #F4A460;
      border-color: #F4A460;
      transform: scale(1.05);
    }

    .popup {
      display: none;
      position: fixed;
      z-index: 100;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(44, 24, 16, 0.9);
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    }

    .popup-content {
      display: flex;
      background: linear-gradient(145deg, #F4A460, #DAA520);
      border-radius: 20px;
      max-width: 1000px;
      width: 90%;
      padding: 30px;
      position: relative;
      border: 3px solid #8B4513;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .popup-content img {
      width: 350px;
      max-width: 100%;
      height: auto;
      border-radius: 15px;
      margin-right: 25px;
      box-shadow: 0 10px 25px rgba(44, 24, 16, 0.4);
      border: 3px solid #8B4513;
    }

    .popup-content .description {
      width: 50%;
      text-align: left;
      color: #2c1810;
      font-size: 1rem;
      line-height: 1.6;
    }

    .popup-content .description p {
      margin: 0;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      border-left: 4px solid #8B4513;
    }

    .close-popup {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      color: #2c1810;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .close-popup:hover {
      background: rgba(139, 69, 19, 0.8);
      color: #DAA520;
      transform: scale(1.1);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .character-title {
        font-size: 2rem;
      }
      
      .popup-content {
        flex-direction: column;
        width: 95%;
        padding: 20px;
      }
      
      .popup-content img {
        width: 100%;
        margin-right: 0;
        margin-bottom: 20px;
      }
      
      .popup-content .description {
        width: 100%;
      }
      
      .gallery-container {
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<header>
  <a href="cast-member1.html" class="home-link">← Back to Deta</a>
</header>

<div class="character-header">
  <h1 class="character-title">Deta Gallery</h1>
  <p class="character-subtitle">The Randeth Hero • Stone and Wood Guardian</p>
</div>

<div class="gallery-container" id="gallery"></div>

<!-- Popup Modal -->
<div class="popup" id="popup">
  <div class="popup-content">
    <span class="close-popup" onclick="closePopup()">&times;</span>
    <img id="popup-img" src="" alt="Popup Image" loading="lazy">
    <div class="description">
      <p id="popup-desc">Description</p>
    </div>
  </div>
</div>

<script>
  const imageData = [
    {
      src: "deta-1.jpg",
      alt: "Deta-Image 1",
      desc: "This is Deta's main portrait. He is the Main character of the story, a young Randeth who has never left his home until a young girl came to his door and asked for help. His jorney is long and he ends up giving up more than he bargined for, After Saveing Gwen and Helping the Kingdom of Sumring. He is revered as a hero amoung the surviving townsfolk, but with his mother now gone, he is lost on where to go now. Art by <a href='https://www.facebook.com/karina.romero.794628' target='_blank'>Karina Romero</a>"
    },
    {
      src: "Deta-image2.jpg",
      alt: "Deta-Image 2",
      desc: "Deta"
    },
    {
      src: "Deta-image3.jpg",
      alt: "Deta-Image 3",
      desc: "Deta"
    },
    // Add more Deta images and descriptions as needed
  ];

  const gallery = document.getElementById("gallery");

  imageData.forEach((img) => {
    const card = document.createElement("div");
    card.className = "image-card";
    card.innerHTML = `
      <img src="${img.src}" alt="${img.alt}" loading="lazy">
      <button onclick="openPopup('${img.src}', \`${img.desc}\`)">Read about</button>
    `;
    gallery.appendChild(card);
  });

  function openPopup(imgSrc, desc) {
    document.getElementById('popup-img').src = imgSrc;
    document.getElementById('popup-desc').innerHTML = desc;
    document.getElementById('popup').style.display = 'flex';
  }

  function closePopup() {
    document.getElementById('popup').style.display = 'none';
  }
</script>

</body>
</html>
