<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Sheet Result - Entine Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-mobile.css" media="only screen and (max-width: 500px)">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #232526 0%, #485563 100%);
            background-image: url('tavern-backround.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #FFD700;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-areas: 
                "nav"
                "main"
                "footer";
        }

        .main-nav {
            grid-area: nav;
        }

        main {
            grid-area: main;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .result-container {
            background: rgba(36, 54, 39, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 3px solid #FFD700;
            max-width: 800px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .character-sheet {
            background: rgba(46, 64, 49, 0.9);
            border-radius: 15px;
            padding: 30px;
            border: 2px solid #FFA500;
            margin-top: 20px;
        }

        .character-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .character-name {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 2.5em;
            color: #FFD700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            border: 1px solid #FFD700;
        }

        .character-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .info-box {
            background: rgba(36, 54, 39, 0.8);
            border: 1px solid #FFD700;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .info-label {
            color: #FFA500;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #FFFFFF;
            font-size: 1.2em;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .stat-box {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #FFD700;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-name {
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .stat-value {
            color: #FFFFFF;
            font-size: 1.8em;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 24px;
            font-size: 1.1em;
            border: 2px solid #FFD700;
            border-radius: 10px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #FFA500, #FF8C00);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
            text-decoration: none;
            color: #000;
        }

        .save-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-color: #4CAF50;
        }

        .save-btn:hover {
            background: linear-gradient(135deg, #45a049, #3d8b40);
            border-color: #45a049;
        }

        footer {
            grid-area: footer;
            background: rgba(36, 54, 39, 0.95);
            padding: 20px;
            text-align: center;
            border-top: 2px solid #FFD700;
            color: #FFD700;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.2);
            border: 2px solid #dc3545;
            border-radius: 10px;
            padding: 20px;
            color: #ff6b6b;
            text-align: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .character-header {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .character-info {
                grid-template-columns: 1fr;
            }
            
            .actions {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">🏰 Entine Calculator</a>
            
            <ul class="nav-menu">
                <li><a href="home-page.html">Home</a></li>
                <li class="dropdown">
                    <a href="#">Tools ▼</a>
                    <div class="dropdown-content">
                        <a href="age-calculator.html">Age Calculator</a>
                        <a href="language-translator.html">Language Translator</a>
                        <a href="money-converter.html">Money Converter</a>
                        <a href="name-generator.html" class="active">Name Generator</a>
                        <a href="fight.html">Conflict Generator</a>
                    </div>
                </li>
                <li class="dropdown">
                    <a href="#">World ▼</a>
                    <div class="dropdown-content">
                        <a href="cast.html">The Cast</a>
                        <a href="library.html">The Library</a>
                        <a href="home-maker.html">Magic Codex</a>

                </li>

            </ul>
            
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <div class="result-container">
            <h1>🎲 Your Generated Character</h1>
            <div id="characterDisplay">
                <!-- Character data will be populated here -->
            </div>
            
            <div class="actions">
                <a href="name-generator.html" class="action-btn">🔄 Generate Another</a>
                <button class="action-btn save-btn" onclick="saveToFavorites()">💾 Save to Favorites</button>
                <button class="action-btn" onclick="shareCharacter()">📤 Share Character</button>
            </div>
        </div>
    </main>

    <footer>
        <a href="references.html">References</a>
        <span>&copy; 2025 Caleb Jones</span>
    </footer>

    <script type="module">
        // Character name databases by species
        const nameDatabase = {
            human: {
                male: ['Aiden', 'Marcus', 'Garrett', 'Edmund', 'Thane', 'Roland', 'Castor', 'Darius'],
                female: ['Elena', 'Isabella', 'Seraphina', 'Lyanna', 'Cordelia', 'Morgana', 'Aria', 'Celeste']
            },
            'half-elf': {
                male: ['Aelar', 'Aerdran', 'Ahvak', 'Aramil', 'Aranea', 'Berrian', 'Dayereth', 'Enna'],
                female: ['Adrie', 'Ahvna', 'Aramil', 'Aranea', 'Berrian', 'Caelynn', 'Carric', 'Dayereth']
            },
            elf: {
                male: ['Adran', 'Aelar', 'Aramil', 'Aranea', 'Berrian', 'Carric', 'Dayereth', 'Enna'],
                female: ['Adrie', 'Ahvna', 'Aramil', 'Aranea', 'Berrian', 'Caelynn', 'Carric', 'Dayereth']
            },
            randeth: {
                male: ['Thraex', 'Vorthak', 'Zethran', 'Kyros', 'Drakmor', 'Nethys', 'Vexus', 'Zorran'],
                female: ['Xylia', 'Zara', 'Nyth', 'Vera', 'Kiara', 'Lyxa', 'Nyx', 'Zira']
            },
            dwarf: {
                male: ['Thorin', 'Gimli', 'Balin', 'Dwalin', 'Oin', 'Gloin', 'Fili', 'Kili'],
                female: ['Dara', 'Nala', 'Hilda', 'Brenna', 'Mira', 'Vera', 'Kata', 'Nora']
            },
            demon: {
                male: ['Bael', 'Malphas', 'Valefor', 'Asmodeus', 'Beleth', 'Purson', 'Marax', 'Ipos'],
                female: ['Lilith', 'Agares', 'Vepar', 'Botis', 'Bathin', 'Sallos', 'Belial', 'Leraje']
            }
        };

        // Character classes and their base stats
        const characterClasses = {
            warrior: { strength: 16, dexterity: 12, intelligence: 10, wisdom: 13, constitution: 15, charisma: 11 },
            mage: { strength: 8, dexterity: 12, intelligence: 16, wisdom: 14, constitution: 10, charisma: 13 },
            rogue: { strength: 11, dexterity: 16, intelligence: 13, wisdom: 12, constitution: 12, charisma: 14 },
            cleric: { strength: 13, dexterity: 10, intelligence: 12, wisdom: 16, constitution: 14, charisma: 15 },
            ranger: { strength: 14, dexterity: 15, intelligence: 12, wisdom: 15, constitution: 13, charisma: 10 },
            bard: { strength: 10, dexterity: 14, intelligence: 13, wisdom: 12, constitution: 12, charisma: 16 },
            paladin: { strength: 15, dexterity: 10, intelligence: 11, wisdom: 13, constitution: 14, charisma: 16 },
            warlock: { strength: 9, dexterity: 13, intelligence: 14, wisdom: 11, constitution: 13, charisma: 16 }
        };

        // Age ranges by species
        const ageRanges = {
            human: { min: 18, max: 80 },
            'half-elf': { min: 20, max: 180 },
            elf: { min: 100, max: 750 },
            randeth: { min: 25, max: 300 },
            dwarf: { min: 40, max: 350 },
            demon: { min: 150, max: 1000 }
        };

        function getURLParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                gender: urlParams.get('gender'),
                species: urlParams.get('species'),
                characterClass: urlParams.get('characterClass'),
                playerName: urlParams.get('playerName')
            };
        }

        function generateRandomName(species, gender) {
            const names = nameDatabase[species] || nameDatabase.human;
            const genderNames = names[gender] || names.male;
            return genderNames[Math.floor(Math.random() * genderNames.length)];
        }

        function generateRandomAge(species) {
            const range = ageRanges[species] || ageRanges.human;
            return Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
        }

        function generateStats(characterClass) {
            const baseStats = characterClasses[characterClass] || characterClasses.warrior;
            const stats = {};
            
            for (const [stat, base] of Object.entries(baseStats)) {
                // Add some randomness (-2 to +3)
                const modifier = Math.floor(Math.random() * 6) - 2;
                stats[stat] = Math.max(3, Math.min(18, base + modifier));
            }
            
            return stats;
        }

        function displayCharacter() {
            const params = getURLParams();
            const characterDisplay = document.getElementById('characterDisplay');
            
            // Validate required parameters
            if (!params.gender || !params.species || !params.characterClass) {
                characterDisplay.innerHTML = `
                    <div class="error-message">
                        <h2>⚠️ Missing Information</h2>
                        <p>Please fill out all required fields in the character generator.</p>
                        <a href="name-generator.html" class="action-btn">Return to Generator</a>
                    </div>
                `;
                return;
            }

            const characterName = generateRandomName(params.species, params.gender);
            const age = generateRandomAge(params.species);
            const stats = generateStats(params.characterClass);
            
            characterDisplay.innerHTML = `
                <div class="character-sheet">
                    <div class="character-name">${characterName}</div>
                    
                    <div class="character-info">
                        <div class="info-box">
                            <div class="info-label">Species</div>
                            <div class="info-value">${params.species.charAt(0).toUpperCase() + params.species.slice(1)}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Gender</div>
                            <div class="info-value">${params.gender.charAt(0).toUpperCase() + params.gender.slice(1)}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Class</div>
                            <div class="info-value">${params.characterClass.charAt(0).toUpperCase() + params.characterClass.slice(1)}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Age</div>
                            <div class="info-value">${age} years</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Created by</div>
                            <div class="info-value">${params.playerName}</div>
                        </div>
                    </div>
                    
                    <h3 style="color: #FFD700; text-align: center; margin: 30px 0 20px 0;">Character Stats</h3>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-name">Strength</div>
                            <div class="stat-value">${stats.strength}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-name">Dexterity</div>
                            <div class="stat-value">${stats.dexterity}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-name">Intelligence</div>
                            <div class="stat-value">${stats.intelligence}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-name">Wisdom</div>
                            <div class="stat-value">${stats.wisdom}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-name">Constitution</div>
                            <div class="stat-value">${stats.constitution}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-name">Charisma</div>
                            <div class="stat-value">${stats.charisma}</div>
                        </div>
                    </div>
                </div>
            `;
            
            // Store character data for saving/sharing
            window.currentCharacter = {
                name: characterName,
                species: params.species,
                gender: params.gender,
                characterClass: params.characterClass,
                age: age,
                stats: stats,
                creator: params.playerName,
                created: new Date().toISOString()
            };
        }

        function saveToFavorites() {
            if (!window.currentCharacter) return;
            
            // Get existing favorites from localStorage
            const favorites = JSON.parse(localStorage.getItem('entine-favorites') || '[]');
            
            // Add current character
            favorites.push(window.currentCharacter);
            
            // Save back to localStorage
            localStorage.setItem('entine-favorites', JSON.stringify(favorites));
            
            alert('Character saved to favorites! ⭐');
        }

        function shareCharacter() {
            if (!window.currentCharacter) return;
            
            const shareText = `Check out my Entine character: ${window.currentCharacter.name}, a ${window.currentCharacter.age}-year-old ${window.currentCharacter.species} ${window.currentCharacter.characterClass}!`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'My Entine Character',
                    text: shareText,
                    url: window.location.href
                });
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(shareText + ' ' + window.location.href)
                    .then(() => alert('Character info copied to clipboard! 📋'))
                    .catch(() => prompt('Copy this text to share:', shareText + ' ' + window.location.href));
            }
        }

        // Make functions globally available
        window.saveToFavorites = saveToFavorites;
        window.shareCharacter = shareCharacter;

        // Initialize page
        document.addEventListener('DOMContentLoaded', displayCharacter);
    </script>
    <script type="module" src="navigation.js"></script>
</body>
</html>
